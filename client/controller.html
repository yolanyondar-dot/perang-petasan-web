<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Perang Petasan - Controller</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #0b1020; color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        touch-action: none; user-select: none; -webkit-user-select: none;
      }
      body { position: fixed; inset: 0; }
      button, input { font: inherit; }
      .screen { position: absolute; inset: 0; display: none; }
      .screen.active { display: flex; }

      /* Join */
      #join-screen {
        flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        padding: 16px; background: radial-gradient(circle at top, #1d3557, #0b1020 65%);
      }
      .card {
        width: min(420px, 100%); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px; padding: 20px; backdrop-filter: blur(8px);
      }
      h1 { font-size: 28px; letter-spacing: 2px; text-align: center; margin-bottom: 4px; }
      .sub { text-align: center; opacity: .8; font-size: 14px; margin-bottom: 18px; }
      label { display: block; font-size: 13px; opacity: .85; margin-bottom: 6px; }
      input {
        width: 100%; padding: 14px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.18);
        background: rgba(0,0,0,0.25); color: #fff; font-size: 18px; margin-bottom: 14px;
      }
      #room-code { text-transform: uppercase; letter-spacing: 4px; font-weight: 700; text-align: center; }
      .join-btn {
        width: 100%; padding: 14px; border-radius: 12px; border: 0; background: #ffd54f; color: #111;
        font-weight: 800; font-size: 18px; cursor: pointer;
      }
      .join-btn:active { transform: scale(.98); }
      #join-status { min-height: 22px; margin-top: 12px; font-size: 14px; text-align: center; color: #ffb4b4; }
      #join-status.ok { color: #9bf6a3; }

      /* Pad */
      #pad-screen { flex-direction: column; padding: 8px; gap: 6px; background: radial-gradient(circle at 50% 100%, #16213a, #0b1020 70%); }
      #topbar {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,0.05); font-size: 12px; z-index: 5;
      }
      #topbar b { color: #ffd54f; }
      #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; display: inline-block; margin-right: 6px; }
      .top-actions { display:flex; gap:6px; align-items:center; }
      .mini-btn { border:0; border-radius:8px; padding:6px 10px; background:rgba(255,255,255,0.12); color:#fff; font-size:11px; font-weight:700; }

      #pad-area {
        flex: 1; min-height: 0; display: grid; grid-template-columns: 42% 58%; gap: 8px; padding: 2px;
      }
      .panel { position: relative; min-height: 0; overflow: hidden; border-radius: 18px; }

      /* Joystick */
      #joystick-panel { display:flex; align-items:flex-end; justify-content:flex-start; padding: 0 0 18px 18px; }
      #joy-base {
        width: min(42vw, 220px); aspect-ratio: 1; max-width: 220px;
        border-radius: 50%; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.12);
        position: relative; touch-action: none;
        box-shadow: inset 0 0 30px rgba(0,0,0,0.25);
      }
      #joy-base::before {
        content:''; position:absolute; inset:18%; border-radius:50%; border:1px solid rgba(255,255,255,0.07);
      }
      #joy-knob {
        width: 38%; aspect-ratio: 1; border-radius: 50%; position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%); background: radial-gradient(circle at 30% 30%, #9be7ff, #219ebc);
        box-shadow: 0 8px 20px rgba(0,0,0,0.35), inset 0 1px 2px rgba(255,255,255,0.5); pointer-events: none;
      }
      #joy-label { position:absolute; bottom:-18px; width:100%; text-align:center; font-size:11px; opacity:.5; letter-spacing:1px; }

      /* MOBA action cluster */
      #actions-panel { display:flex; align-items:flex-end; justify-content:flex-end; padding: 0 16px 14px 0; }
      .action-cluster {
        position: relative; width: min(52vw, 320px); aspect-ratio: 1; max-width: 320px;
      }
      .action-btn {
        position: absolute; border: 0; color: #111; font-weight: 900; cursor: pointer; touch-action: none;
        display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;
        box-shadow: 0 8px 0 rgba(0,0,0,0.28), 0 10px 20px rgba(0,0,0,0.2);
        transition: filter .08s;
      }
      .action-btn .lbl { font-size: 11px; letter-spacing:.5px; }
      .action-btn .sub { font-size: 9px; opacity:.75; margin-top:2px; }
      .action-btn:active, .action-btn.active { transform: translateY(4px) scale(.98); box-shadow: 0 4px 0 rgba(0,0,0,0.28); filter: brightness(1.08); }

      /* Big attack */
      #btn-punch {
        width: 42%; aspect-ratio:1; right: 6%; bottom: 6%; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffb3ad, #ff5252);
        font-size: 18px;
      }
      #btn-punch .lbl { font-size: 15px; }
      /* Skill buttons */
      .skill {
        width: 24%; aspect-ratio:1; border-radius: 50%; font-size: 11px;
        border: 2px solid rgba(255,255,255,0.15);
      }
      #btn-bomb { right: 36%; bottom: 42%; background: radial-gradient(circle at 35% 30%, #ffe082, #ffb300); }
      #btn-jump { right: 58%; bottom: 18%; background: radial-gradient(circle at 35% 30%, #b9f6ca, #69f0ae); }
      #btn-grab { right: 12%; bottom: 50%; background: radial-gradient(circle at 35% 30%, #b3d4ff, #448aff); }
      .skill .lbl { font-size: 10px; }
      .skill .sub { font-size: 8px; }

      /* Landscape hint overlay */
      #orientation-overlay {
        position: absolute; inset: 0; display: none; z-index: 50;
        background: rgba(7,10,20,0.92); backdrop-filter: blur(4px);
        align-items: center; justify-content: center; padding: 24px; text-align: center;
      }
      #orientation-overlay.show { display: flex; }
      .orient-card {
        max-width: 360px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px; padding: 24px;
      }
      .orient-icon { font-size: 52px; margin-bottom: 10px; }
      .orient-card h2 { font-size: 20px; margin-bottom: 8px; color: #ffd54f; }
      .orient-card p { font-size: 14px; opacity: .85; line-height: 1.5; margin-bottom: 14px; }
      .orient-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
      .orient-actions button {
        border:0; border-radius:12px; padding:12px 16px; font-weight:800; cursor:pointer;
      }
      #btn-fullscreen { background:#ffd54f; color:#111; }
      #btn-dismiss-orient { background:rgba(255,255,255,0.12); color:#fff; }

      @media (orientation: landscape) {
        #orientation-overlay.auto-hide { display: none !important; }
      }
      @media (orientation: portrait) {
        #pad-area { grid-template-columns: 1fr; grid-template-rows: 45% 55%; }
        #joystick-panel { align-items:center; justify-content:center; padding: 8px; }
        #actions-panel { align-items:center; justify-content:center; padding: 8px; }
        #joy-base { width: min(58vw, 240px); }
        .action-cluster { width: min(78vw, 320px); }
      }
      @media (max-height: 420px) {
        #topbar { padding: 4px 8px; font-size: 11px; }
        #joy-base { width: min(38vh, 180px); }
        .action-cluster { width: min(58vh, 260px); }
      }
    </style>
  </head>
  <body>
    <section id="join-screen" class="screen active">
      <div class="card">
        <h1>PERANG PETASAN</h1>
        <div class="sub">Controller MOBA</div>
        <label for="room-code">Kode Room (4 huruf)</label>
        <input id="room-code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" />
        <label for="player-name">Nama Pemain (opsional)</label>
        <input id="player-name" maxlength="24" autocomplete="off" placeholder="Pemain" />
        <button id="join-btn" class="join-btn">Gabung</button>
        <div id="join-status"></div>
      </div>
    </section>

    <section id="pad-screen" class="screen">
      <div id="topbar">
        <div><span id="status-dot"></span><b id="room-label">ROOM</b> <span id="name-label"></span></div>
        <div class="top-actions">
          <span id="net-label">terhubung</span>
          <button id="btn-fs-top" class="mini-btn" type="button">Fullscreen</button>
        </div>
      </div>
      <div id="pad-area">
        <div id="joystick-panel" class="panel">
          <div id="joy-base">
            <div id="joy-knob"></div>
            <div id="joy-label">GERAK</div>
          </div>
        </div>
        <div id="actions-panel" class="panel">
          <div class="action-cluster">
            <button id="btn-bomb" class="action-btn skill" data-action="bomb"><span class="lbl">BOM</span><span class="sub">PETASAN</span></button>
            <button id="btn-grab" class="action-btn skill" data-action="grabThrow"><span class="lbl">GRAB</span><span class="sub">ANGKAT</span></button>
            <button id="btn-jump" class="action-btn skill" data-action="jump"><span class="lbl">JUMP</span><span class="sub">LOMPAT</span></button>
            <button id="btn-punch" class="action-btn" data-action="punch"><span class="lbl">TINJU</span><span class="sub">ATTACK</span></button>
          </div>
        </div>
      </div>

      <div id="orientation-overlay" class="show auto-hide">
        <div class="orient-card">
          <div class="orient-icon">📱↔️</div>
          <h2>Mode Landscape Disarankan</h2>
          <p>Untuk kontrol MOBA yang nyaman, putar HP ke posisi <b>landscape</b> dan aktifkan <b>fullscreen</b>.</p>
          <div class="orient-actions">
            <button id="btn-fullscreen" type="button">Fullscreen</button>
            <button id="btn-dismiss-orient" type="button">Lanjut</button>
          </div>
        </div>
      </div>
    </section>

    <script>
      (() => {
        const qs = new URLSearchParams(location.search);
        const serverParam = qs.get('server');

        function getWsBase() {
          if (serverParam) {
            const u = serverParam.replace(/\/$/, '');
            if (u.startsWith('ws://') || u.startsWith('wss://')) return u;
            return u.replace(/^http/, 'ws');
          }
          if (location.port === '5173' || location.port === '5174') {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${proto}//${location.hostname}:3001`;
          }
          const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
          return `${proto}//${location.host}`;
        }

        const joinScreen = document.getElementById('join-screen');
        const padScreen = document.getElementById('pad-screen');
        const roomInput = document.getElementById('room-code');
        const nameInput = document.getElementById('player-name');
        const joinBtn = document.getElementById('join-btn');
        const joinStatus = document.getElementById('join-status');
        const roomLabel = document.getElementById('room-label');
        const nameLabel = document.getElementById('name-label');
        const netLabel = document.getElementById('net-label');
        const orientOverlay = document.getElementById('orientation-overlay');

        const state = { moveX: 0, moveZ: 0, jump: false, punch: false, grabThrow: false, bombHeld: false };
        let ws = null;
        let joined = false;
        let sendTimer = null;
        let lastSent = '';

        function setStatus(msg, ok = false) {
          joinStatus.textContent = msg || '';
          joinStatus.className = ok ? 'ok' : '';
        }

        function send(msg) {
          if (!ws || ws.readyState !== WebSocket.OPEN) return;
          ws.send(JSON.stringify(msg));
        }

        function emitInput(force = false) {
          if (!joined) return;
          const payload = { ...state };
          const json = JSON.stringify(payload);
          if (!force && json === lastSent) return;
          lastSent = json;
          send({ type: 'player-input', state: payload });
        }

        function startSendLoop() {
          stopSendLoop();
          sendTimer = setInterval(() => emitInput(false), 50);
        }
        function stopSendLoop() {
          if (sendTimer) { clearInterval(sendTimer); sendTimer = null; }
        }

        async function requestFullscreen() {
          const el = document.documentElement;
          try {
            if (!document.fullscreenElement && el.requestFullscreen) await el.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
              await screen.orientation.lock('landscape').catch(() => {});
            }
          } catch (_) {}
        }

        function updateOrientationHint() {
          const landscape = window.matchMedia('(orientation: landscape)').matches;
          orientOverlay.classList.toggle('auto-hide', landscape);
          if (landscape) orientOverlay.classList.remove('show');
          else orientOverlay.classList.add('show');
        }
        window.addEventListener('resize', updateOrientationHint);
        window.addEventListener('orientationchange', updateOrientationHint);

        document.getElementById('btn-fullscreen').addEventListener('click', async () => { await requestFullscreen(); updateOrientationHint(); });
        document.getElementById('btn-fs-top').addEventListener('click', requestFullscreen);
        document.getElementById('btn-dismiss-orient').addEventListener('click', () => { orientOverlay.classList.remove('show'); });

        function connectAndJoin() {
          const roomCode = roomInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
          const name = nameInput.value.trim().slice(0, 24);
          roomInput.value = roomCode;
          if (roomCode.length !== 4) { setStatus('Masukkan kode room 4 huruf.'); return; }

          setStatus('Menghubungkan...', true);
          joinBtn.disabled = true;
          try { ws?.close(); } catch (_) {}
          const base = getWsBase();
          const url = `${base}/ws?role=controller&room=${encodeURIComponent(roomCode)}&name=${encodeURIComponent(name)}`;
          ws = new WebSocket(url);

          ws.addEventListener('open', () => { setStatus('Terhubung, menunggu konfirmasi...', true); });
          ws.addEventListener('message', (evt) => {
            let msg;
            try { msg = JSON.parse(String(evt.data)); } catch (_) { return; }
            if (msg.type === 'joined-room' && msg.ok) {
              handleJoined(msg);
            } else if (msg.type === 'join-error') {
              setStatus(msg.message || 'Gagal bergabung ke room.');
              joinBtn.disabled = false;
            } else if (msg.type === 'room-closed') {
              netLabel.textContent = 'room ditutup';
              setStatus('Room ditutup oleh host.');
            }
          });
          ws.addEventListener('close', () => {
            netLabel.textContent = 'terputus';
            if (!joined) { setStatus('Koneksi gagal / terputus.'); joinBtn.disabled = false; }
          });
          ws.addEventListener('error', () => {
            if (!joined) { setStatus('Gagal konek ke server.'); joinBtn.disabled = false; }
          });
        }

        async function handleJoined(res) {
          if (joined) return;
          joined = true;
          roomLabel.textContent = res.roomCode;
          nameLabel.textContent = res.name ? `• ${res.name}` : '';
          joinScreen.classList.remove('active');
          padScreen.classList.add('active');
          netLabel.textContent = 'terhubung';
          updateOrientationHint();
          startSendLoop();
          emitInput(true);
          // try fullscreen on user gesture flow continuation
          requestFullscreen();
        }

        roomInput.addEventListener('input', () => {
          roomInput.value = roomInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
        });
        joinBtn.addEventListener('click', connectAndJoin);

        // --- Joystick --------------------------------------------------------
        const joyBase = document.getElementById('joy-base');
        const joyKnob = document.getElementById('joy-knob');
        let joyPointer = null;
        let joyCenter = { x: 0, y: 0 };
        let joyRadius = 1;

        function resetJoystick() {
          state.moveX = 0; state.moveZ = 0;
          joyKnob.style.transform = 'translate(-50%, -50%)';
          emitInput(true);
        }

        function updateJoystick(clientX, clientY) {
          const dx = clientX - joyCenter.x;
          const dy = clientY - joyCenter.y;
          const dist = Math.hypot(dx, dy);
          const max = joyRadius * 0.38;
          const clamped = dist > max ? max / dist : 1;
          const kx = dx * clamped;
          const ky = dy * clamped;
          joyKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
          state.moveX = Math.max(-1, Math.min(1, kx / max));
          state.moveZ = Math.max(-1, Math.min(1, -ky / max));
          emitInput(false);
        }

        joyBase.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          joyPointer = e.pointerId;
          joyBase.setPointerCapture(e.pointerId);
          const r = joyBase.getBoundingClientRect();
          joyCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
          joyRadius = r.width / 2;
          updateJoystick(e.clientX, e.clientY);
        });
        joyBase.addEventListener('pointermove', (e) => {
          if (e.pointerId !== joyPointer) return;
          e.preventDefault();
          updateJoystick(e.clientX, e.clientY);
        });
        function joyEnd(e) {
          if (e.pointerId !== joyPointer) return;
          joyPointer = null;
          resetJoystick();
        }
        joyBase.addEventListener('pointerup', joyEnd);
        joyBase.addEventListener('pointercancel', joyEnd);

        // --- Buttons ---------------------------------------------------------
        function bindActionButton(el, downFn, upFn) {
          let pointer = null;
          el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            pointer = e.pointerId;
            el.setPointerCapture?.(e.pointerId);
            el.classList.add('active');
            downFn();
            emitInput(true);
          });
          const end = (e) => {
            if (pointer !== null && e.pointerId !== pointer) return;
            pointer = null;
            el.classList.remove('active');
            upFn();
            emitInput(true);
          };
          el.addEventListener('pointerup', end);
          el.addEventListener('pointercancel', end);
          el.addEventListener('pointerleave', (e) => { if (pointer !== null && e.pointerId === pointer) end(e); });
        }

        bindActionButton(document.getElementById('btn-jump'), () => { state.jump = true; }, () => { state.jump = false; });
        bindActionButton(document.getElementById('btn-punch'), () => { state.punch = true; }, () => { state.punch = false; });
        bindActionButton(document.getElementById('btn-grab'), () => { state.grabThrow = true; }, () => { state.grabThrow = false; });
        bindActionButton(document.getElementById('btn-bomb'), () => { state.bombHeld = true; }, () => { state.bombHeld = false; });

        document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('touchmove', (e) => { if (joined) e.preventDefault(); }, { passive: false });
      })();
    </script>
  </body>
</html>
