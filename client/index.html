<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Perang Petasan 2D - MOBA</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #111827; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; }
      #app { position: fixed; inset: 0; display: grid; place-items: center; }
      canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); max-width: 100%; max-height: 100%; background: #87ceeb; touch-action: none; }
      #hud {
        position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 10px;
        background: rgba(15,23,42,.58); color: #fff; font-size: 12px; z-index: 20; backdrop-filter: blur(4px);
      }
      #hud b { color: #ffd54f; }
      #hint {
        position: fixed; top: 44px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 11px;
        background: rgba(15,23,42,.45); padding: 4px 8px; border-radius: 8px; z-index: 20;
      }
      @media (max-width: 900px) { #hint { display: none; } }

      /* MOBA controls */
      #moba-controls { position: fixed; inset: 0; pointer-events: none; z-index: 15; }
      .joy-zone { position: absolute; left: 0; bottom: 0; width: 42%; height: 55%; pointer-events: none; }
      .joy-base {
        position: absolute; left: 28px; bottom: 28px; width: 128px; height: 128px; border-radius: 50%;
        background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.22);
        pointer-events: auto; touch-action: none;
      }
      .joy-knob {
        position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin-left: -28px; margin-top: -28px;
        border-radius: 50%; background: rgba(255,213,79,0.85); box-shadow: 0 4px 12px rgba(0,0,0,.3);
      }
      .btn-zone { position: absolute; right: 0; bottom: 0; width: 50%; height: 60%; pointer-events: none; }
      .skill-row { position: absolute; right: 24px; bottom: 150px; display: flex; gap: 10px; pointer-events: auto; }
      .main-row { position: absolute; right: 24px; bottom: 24px; display: flex; gap: 14px; align-items: flex-end; pointer-events: auto; }
      .act-btn {
        position: relative; width: 68px; height: 68px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25);
        background: rgba(30,41,59,.72); color: #fff; font-weight: 800; pointer-events: auto; touch-action: none;
        display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none;
      }
      .act-btn .lbl { font-size: 12px; line-height: 1; }
      .act-btn .sub { font-size: 9px; opacity: .75; margin-top: 2px; }
      .act-btn.attack { width: 92px; height: 92px; background: rgba(239,68,68,.75); border-color: rgba(255,255,255,.3); }
      .act-btn.jump { width: 72px; height: 72px; background: rgba(59,130,246,.72); }
      .act-btn.skill { width: 62px; height: 62px; background: rgba(245,158,11,.7); }
      .act-btn.ulti { width: 66px; height: 66px; background: rgba(100,116,139,.7); }
      .act-btn.ulti.ready { background: rgba(168,85,247,.85); box-shadow: 0 0 18px rgba(168,85,247,.7); }
      .act-btn.pressed { transform: scale(0.95); }
      .act-btn.cooling { filter: grayscale(0.35) brightness(0.85); }
      .cd { position: absolute; inset: -2px; width: calc(100% + 4px); height: calc(100% + 4px); transform: rotate(-90deg); pointer-events: none; }
      .cd-bg { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 3; }
      .cd-fg { fill: none; stroke: rgba(15,23,42,0.65); stroke-width: 3.2; stroke-dasharray: 100.5; stroke-dashoffset: 100.5; }
      .ulti-bar { position: absolute; bottom: 6px; left: 10px; right: 10px; height: 4px; background: rgba(0,0,0,.35); border-radius: 4px; overflow: hidden; }
      .ulti-fill { width: 0%; height: 100%; background: #ffd54f; }
      .ulti.ready .ulti-fill { background: #e879f9; }
      .aim-hint {
        position: absolute; right: 24px; bottom: 250px; color: #fff; font-size: 12px; font-weight: 700;
        background: rgba(15,23,42,.55); padding: 6px 10px; border-radius: 8px; display: none; pointer-events: none;
      }
      .aim-hint.show { display: block; }

      @media (max-width: 700px) {
        .joy-base { width: 108px; height: 108px; left: 18px; bottom: 18px; }
        .joy-knob { width: 48px; height: 48px; margin-left: -24px; margin-top: -24px; }
        .act-btn.attack { width: 80px; height: 80px; }
        .act-btn.jump { width: 64px; height: 64px; }
        .act-btn.skill { width: 54px; height: 54px; }
        .act-btn.ulti { width: 58px; height: 58px; }
        .skill-row { right: 16px; bottom: 130px; gap: 8px; }
        .main-row { right: 16px; bottom: 16px; gap: 10px; }
      }
      @media (orientation: portrait) {
        #rotate { display: flex !important; }
      }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.85); color: #fff;
        align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 20px; font-weight: 700;
      }
      #picker {
        position: fixed; top: 74px; left: 50%; transform: translateX(-50%); z-index: 25;
        display: flex; gap: 8px; padding: 8px; border-radius: 12px; background: rgba(15,23,42,.62); backdrop-filter: blur(4px);
      }
      .pick {
        border: 2px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: #fff; border-radius: 10px;
        padding: 6px 10px; cursor: pointer; font-size: 12px; font-weight: 700; min-width: 86px;
      }
      .pick small { display: block; font-weight: 500; opacity: .75; font-size: 10px; }
      .pick.active { border-color: #ffd54f; background: rgba(255,213,79,.15); }
      @media (max-width: 700px) { #picker { top: auto; bottom: 200px; transform: translateX(-50%) scale(.92); } .pick { min-width: 72px; padding: 5px 7px; } }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="game" width="1280" height="720"></canvas></div>
    <div id="hud">Angin: <b id="wind">0</b> &nbsp;|&nbsp; <b id="status">Siap!</b></div>
    <div id="hint">PC: A/D gerak, Spasi lompat, J basic, K skill1, L skill2, I ulti, mouse drag di canvas untuk bidik</div>
    <div id="picker">
      <button class="pick active" data-char="udin">Bang Udin<small>S1 Banting</small></button>
      <button class="pick" data-char="sari">Mbak Sari<small>S1 Renteng</small></button>
      <button class="pick" data-char="hendra">Mas Hendra<small>S1 Dorong</small></button>
      <button class="pick" data-char="dika">Dika<small>S1 Kilat</small></button>
    </div>
    <div id="rotate">Putar HP ke mode <span style="color:#ffd54f">&nbsp;Landscape&nbsp;</span> untuk bermain</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
