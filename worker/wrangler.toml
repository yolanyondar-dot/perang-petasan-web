name = "perang-petasan"
main = "src/index.ts"
compatibility_date = "2026-11-20"
workers_dev = true

# Client Vite dibangun dulu, lalu disajikan dari satu origin yang sama dengan /ws.
[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "FIGHT_ROOM"
class_name = "FightRoom"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

# Free plan Workers hanya mendukung Durable Objects berbasis SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["FightRoom", "Matchmaker"]

# Domain produksi: zone root yondarprojects.my.id berada di akun Cloudflare ini.
[[routes]]
pattern = "petasan.yondarprojects.my.id"
custom_domain = true
