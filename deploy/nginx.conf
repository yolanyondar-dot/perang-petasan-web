# -----------------------------------------------------------------------------
# Perang Petasan: Arena PvP 2D — konfigurasi Nginx produksi
# -----------------------------------------------------------------------------
# Pasang sebagai /etc/nginx/nginx.conf (file ini adalah konfigurasi lengkap,
# karena directive `map` harus berada di dalam blok `http`).
#
# Sebelum dipakai, ubah:
#   1. `server_name` -> domain Anda
#   2. `root`        -> lokasi client/dist di server
#   3. sertifikat SSL (lihat deploy/README.md)
# -----------------------------------------------------------------------------

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Dibutuhkan untuk Upgrade WebSocket Colyseus.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream colyseus {
        server 127.0.0.1:2567;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name example.com www.example.com;      # <-- GANTI DOMAIN

        root /var/www/perang-petasan/client/dist;      # <-- GANTI PATH
        index index.html;
        client_max_body_size 2m;

        # Aset Vite sudah di-hash -> boleh di-cache permanen.
        # `^~` mencegah blok regex gambar di bawah menimpa aturan ini.
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Gambar/ikon lain di root (jika ada).
        location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Health check game server (dipakai monitoring).
        location = /health {
            proxy_pass http://colyseus;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------------------------------------------------------------------
        # Colyseus: endpoint produksi client adalah ws(s)://<domain>/ws
        #   HTTP  : /ws/matchmake/joinOrCreate/moba
        #   WS    : /ws/<roomId>/<sessionId>
        # Trailing slash pada proxy_pass membuang prefix /ws sebelum diteruskan.
        # -------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://colyseus/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SPA fallback.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS (disarankan): jalankan `sudo certbot --nginx -d example.com ...`
    # Certbot akan menambahkan server block 443 + redirect otomatis di sini.
    # Untuk WebSocket tetap menggunakan location /ws/ seperti di atas.
    # -------------------------------------------------------------------------
}
